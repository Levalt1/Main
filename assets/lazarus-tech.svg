<svg width="900" height="650" viewBox="0 0 900 650"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07070b"/>
    <stop offset="48%" stop-color="#0d0714"/>
    <stop offset="100%" stop-color="#160621"/>
  </linearGradient>

  <linearGradient id="purpleLine" x1="0" x2="1">
    <stop offset="0%" stop-color="#3b0764"/>
    <stop offset="50%" stop-color="#c084fc"/>
    <stop offset="100%" stop-color="#3b0764"/>
  </linearGradient>

  <linearGradient id="purpleFill" x1="0" x2="1">
    <stop offset="0%" stop-color="#7c3aed"/>
    <stop offset="50%" stop-color="#c084fc"/>
    <stop offset="100%" stop-color="#9333ea"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="scanlines" width="4" height="4"
           patternUnits="userSpaceOnUse">
    <rect width="4" height="1"
          fill="#ffffff"
          opacity=".018"/>
  </pattern>

</defs>


<style>

  .mono {
    font-family:
      "JetBrains Mono",
      "Courier New",
      monospace;
  }

  .ui {
    font-family:
      Inter,
      Arial,
      Helvetica,
      sans-serif;
  }

  .white {
    fill:#f4f4f5;
  }

  .muted {
    fill:#b4b4be;
  }

  .purple {
    fill:#c084fc;
  }

  .green {
    fill:#55ff88;
  }

  .category {
    opacity:0;
    animation:categoryReveal 14s infinite;
  }

  .c1 { animation-delay:.3s; }
  .c2 { animation-delay:.8s; }
  .c3 { animation-delay:1.3s; }
  .c4 { animation-delay:1.8s; }
  .c5 { animation-delay:2.3s; }
  .c6 { animation-delay:2.8s; }
  .c7 { animation-delay:3.3s; }
  .c8 { animation-delay:3.8s; }

  @keyframes categoryReveal {

    0% {
      opacity:0;
      transform:translateY(8px);
    }

    7% {
      opacity:1;
      transform:translateY(0);
    }

    84% {
      opacity:1;
    }

    97%,100% {
      opacity:0;
    }

  }


  .icon {
    stroke:#c084fc;
    fill:none;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
    animation:iconPulse 2.5s ease-in-out infinite;
  }

  @keyframes iconPulse {

    0%,100% {
      opacity:.6;
    }

    50% {
      opacity:1;
      filter:url(#glow);
    }

  }


  .status {
    animation:pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {

    0%,100% {
      opacity:.35;
    }

    50% {
      opacity:1;
    }

  }


  .scanner {
    animation:scanner 4s linear infinite;
  }

  @keyframes scanner {

    from {
      transform:translateX(-250px);
    }

    to {
      transform:translateX(1100px);
    }

  }


  .progress {
    transform-origin:left;
    animation:progress 14s infinite;
  }

  @keyframes progress {

    0% {
      transform:scaleX(0);
    }

    35% {
      transform:scaleX(.35);
    }

    65% {
      transform:scaleX(.72);
    }

    82% {
      transform:scaleX(1);
    }

    94% {
      transform:scaleX(1);
    }

    100% {
      transform:scaleX(0);
    }

  }


  .chip {
    fill:#100817;
    stroke:#552273;
    stroke-width:1;
  }


  .chipText {
    font-family:
      "JetBrains Mono",
      "Courier New",
      monospace;

    fill:#d8b4fe;
    font-size:10px;
  }

</style>


