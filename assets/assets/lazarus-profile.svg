<svg width="900" height="720" viewBox="0 0 900 720"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050509"/>
      <stop offset="45%" stop-color="#0d0615"/>
      <stop offset="100%" stop-color="#180525"/>
    </linearGradient>

    <linearGradient id="purpleLine" x1="0" x2="1">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines"
             width="4"
             height="4"
             patternUnits="userSpaceOnUse">

      <rect width="4"
            height="1"
            fill="#ffffff"
            opacity=".018"/>

    </pattern>

  </defs>


  <style>

    .mono {
      font-family:
        "JetBrains Mono",
        "Courier New",
        monospace;
    }

    .normal {
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    .white {
      fill: #f4f4f5;
    }

    .purple {
      fill: #c084fc;
    }

    .muted {
      fill: #a1a1aa;
    }

    .green {
      fill: #55ff88;
    }


    /* ============================= */
    /*         MAIN TIMELINE         */
    /* ============================= */

    /*
        16 SECOND LOOP

        0-2s     Identity
        2-4s     Motto
        4-7s     About
        7-11s    Quotes
        11-14s   Final identity
        14-16s   Hold + reset
    */


    /* INTRO */

    .intro {
      opacity: 0;
      animation: intro 16s infinite;
    }

    @keyframes intro {

      0% {
        opacity: 0;
        transform: translateY(15px);
      }

      7% {
        opacity: 1;
        transform: translateY(0);
      }

      90% {
        opacity: 1;
      }

      97% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }

    }


    /* SUBTITLE */

    .subtitle {
      opacity: 0;
      animation: subtitle 16s infinite;
    }

    @keyframes subtitle {

      0%, 9% {
        opacity: 0;
        transform: translateY(8px);
      }

      16% {
        opacity: 1;
        transform: translateY(0);
      }

      90% {
        opacity: 1;
      }

      97%, 100% {
        opacity: 0;
      }

    }


    /* MOTTO */

    .motto {
      opacity: 0;
      animation: motto 16s infinite;
    }

    @keyframes motto {

      0%, 16% {
        opacity: 0;
      }

      23%, 90% {
        opacity: 1;
      }

      97%, 100% {
        opacity: 0;
      }

    }


    /* CROW / SYMBOL */

    .crow {
      opacity: 0;
      animation: crow 16s infinite;
      transform-origin: 450px 245px;
    }

    @keyframes crow {

      0%, 20% {
        opacity: 0;
        transform: scale(.8);
      }

      28% {
        opacity: 1;
        transform: scale(1.05);
      }

      32%, 90% {
        opacity: 1;
        transform: scale(1);
      }

      97%, 100% {
        opacity: 0;
      }

    }


    /* ABOUT */

    .aboutTitle {
      opacity: 0;
      animation: aboutTitle 16s infinite;
    }

    @keyframes aboutTitle {

      0%, 28% {
        opacity: 0;
        transform: translateX(-12px);
      }

      35%, 90% {
        opacity: 1;
        transform: translateX(0);
      }

      97%, 100% {
        opacity: 0;
      }

    }


    .about1 {
      opacity: 0;
      animation: about1 16s infinite;
    }

    .about2 {
      opacity: 0;
      animation: about2 16s infinite;
    }

    .about3 {
      opacity: 0;
      animation: about3 16s infinite;
    }

    .about4 {
      opacity: 0;
      animation: about4 16s infinite;
    }


    @keyframes about1 {

      0%, 34% {
        opacity: 0;
      }

      40%, 90% {
        opacity: 1;
      }

      97%,100% {
        opacity: 0;
      }

    }


    @keyframes about2 {

      0%, 39% {
        opacity: 0;
      }

      45%,90% {
        opacity: 1;
      }

      97%,100% {
        opacity: 0;
      }

    }


    @keyframes about3 {

      0%,44% {
        opacity: 0;
      }

      50%,90% {
        opacity: 1;
      }

      97%,100% {
        opacity: 0;
      }

    }


    @keyframes about4 {

      0%,49% {
        opacity: 0;
      }

      55%,90% {
        opacity: 1;
      }

      97%,100% {
        opacity: 0;
      }

    }


    /* QUOTES */

    .quoteTitle {
      opacity: 0;
      animation: quoteTitle 16s infinite;
    }

    @keyframes quoteTitle {

      0%,54% {
        opacity: 0;
      }

      60%,90% {
        opacity: 1;
      }

      97%,100% {
        opacity: 0;
      }

    }


    .quote1 {
      opacity: 0;
      animation: quote1 16s infinite;
    }

    @keyframes quote1 {

      0%,60% {
        opacity: 0;
      }

      67%,90% {
        opacity: 1;
      }

      97%,100% {
        opacity: 0;
      }

    }


    .quote2 {
      opacity: 0;
      animation: quote2 16s infinite;
    }

    @keyframes quote2 {

      0%,67% {
        opacity: 0;
      }

      74%,90% {
        opacity: 1;
      }

      97%,100% {
        opacity: 0;
      }

    }


    /* STATUS */

    .verified {
      opacity: 0;
      animation: verified 16s infinite;
    }

    @keyframes verified {

      0%,74% {
        opacity: 0;
      }

      81%,91% {
        opacity: 1;
      }

      97%,100% {
        opacity: 0;
      }

    }


    /* CURSOR */

    .cursor {
      animation: blink .65s steps(1) infinite;
    }

    @keyframes blink {

      50% {
        opacity: 0;
      }

    }


    /* STATUS LIGHT */

    .pulse {
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,100% {
        opacity: .35;
      }

      50% {
        opacity: 1;
      }

    }


    /* FLOATING PARTICLES */

    .particle1 {
      animation: particle1 6s ease-in-out infinite;
    }

    .particle2 {
      animation: particle2 7s ease-in-out infinite;
    }

    @keyframes particle1 {

      0%,100% {
        transform: translateY(0);
        opacity: .2;
      }

      50% {
        transform: translateY(-15px);
        opacity: .8;
      }

    }

    @keyframes particle2 {

      0%,100% {
        transform: translateY(0);
        opacity: .2;
      }

      50% {
        transform: translateY(12px);
        opacity: .7;
      }

    }


    /* SCANNER */

    .scanner {
      animation: scanner 4s linear infinite;
    }

    @keyframes scanner {

      0% {
        transform: translateX(-250px);
      }

      100% {
        transform: translateX(1100px);
      }

    }

  </style>


  <!-- ============================== -->
  <!-- BACKGROUND                     -->
  <!-- ============================== -->

  <rect
    x="8"
    y="8"
    width="884"
    height="704"
    rx="16"
    fill="url(#bg)"
    stroke="#7e22ce"
    stroke-width="2"
  />


  <!-- ============================== -->
  <!-- TOP STATUS                     -->
  <!-- ============================== -->

  <text
    x="30"
    y="36"
    class="mono purple"
    font-size="11">

    LEVALT // PERSONAL INTERFACE

  </text>


  <circle
    cx="824"
    cy="31"
    r="4"
    fill="#55ff88"
    class="pulse"
  />


  <text
    x="838"
    y="36"
    class="mono green"
    font-size="10">

    ONLINE

  </text>


  <line
    x1="28"
    y1="52"
    x2="872"
    y2="52"
    stroke="#581c87"
    opacity=".65"
  />


  <!-- ============================== -->
  <!-- INTRODUCTION                   -->
  <!-- ============================== -->

  <g class="intro">

    <text
      x="450"
      y="112"
      text-anchor="middle"
      class="normal white"
      font-size="38"
      font-weight="700">

      Hi there 👋, I'm

      <tspan fill="#c084fc">
        LeValt
      </tspan>

    </text>

  </g>


  <text
    x="450"
    y="151"
    text-anchor="middle"
    class="mono purple subtitle"
    font-size="16">

    Learn To Love Myself Before Loving Someone Else

  </text>


  <text
    x="450"
    y="187"
    text-anchor="middle"
    class="mono muted motto"
    font-size="13">

    &gt; Love to establish new things and destroy them 🕵

  </text>


  <!-- ============================== -->
  <!-- CROW SYMBOL                    -->
  <!-- ============================== -->

  <g class="crow">

    <path
      d="
      M450 216
      C430 201 405 207 397 225
      C411 219 420 225 425 235
      C408 236 395 245 391 260
      C410 252 425 257 436 268
      L424 289
      L451 274
      L478 289
      L465 268
      C477 257 493 252 510 260
      C506 245 493 236 476 235
      C481 225 490 219 504 225
      C496 207 471 201 450 216
      Z"
      fill="#111118"
      stroke="#a855f7"
      stroke-width="2"
    />

    <circle
      cx="462"
      cy="230"
      r="3"
      fill="#c084fc"
      filter="url(#glow)"
    />

  </g>


  <!-- DIVIDER -->

  <line
    x1="80"
    y1="315"
    x2="820"
    y2="315"
    stroke="url(#purpleLine)"
    opacity=".5"
  />


  <!-- ============================== -->
  <!-- ABOUT ME                       -->
  <!-- ============================== -->

  <text
    x="450"
    y="354"
    text-anchor="middle"
    class="normal purple aboutTitle"
    font-size="20"
    font-weight="700">

    🧠 About Me

  </text>


  <text
    x="450"
    y="392"
    text-anchor="middle"
    class="mono white about1"
    font-size="13">

    💻 Programming • Reverse Engineering • Cybersecurity

  </text>


  <text
    x="450"
    y="421"
    text-anchor="middle"
    class="mono muted about2"
    font-size="13">

    🔍 Always curious about how things work

  </text>


  <text
    x="450"
    y="450"
    text-anchor="middle"
    class="mono white about3"
    font-size="13">

    🛠 Build it • Break it • Understand it • Rebuild it

  </text>


  <text
    x="450"
    y="479"
    text-anchor="middle"
    class="mono purple about4"
    font-size="13">

    ⚡ C++ • Lua • Assembly • Unity • Game Development

  </text>


  <!-- DIVIDER -->

  <line
    x1="80"
    y1="510"
    x2="820"
    y2="510"
    stroke="url(#purpleLine)"
    opacity=".5"
  />


  <!-- ============================== -->
  <!-- WORDS I REMEMBER               -->
  <!-- ============================== -->

  <text
    x="450"
    y="548"
    text-anchor="middle"
    class="normal purple quoteTitle"
    font-size="19"
    font-weight="700">

    🕊 Words I Remember

  </text>


  <text
    x="450"
    y="584"
    text-anchor="middle"
    class="mono white quote1"
    font-size="12">

    "I have no special talent. I am only passionately curious."

  </text>


  <text
    x="450"
    y="615"
    text-anchor="middle"
    class="mono muted quote2"
    font-size="11">

    "The important thing is not to stop questioning."

  </text>


  <!-- ============================== -->
  <!-- FINAL STATUS                   -->
  <!-- ============================== -->

  <g class="verified">

    <text
      x="450"
      y="664"
      text-anchor="middle"
      class="mono purple"
      font-size="12"
      font-weight="700"
      filter="url(#glow)">

      [ IDENTITY VERIFIED // LAZARUS PROTOCOL READY ]

    </text>

    <rect
      x="676"
      y="652"
      width="8"
      height="15"
      fill="#c084fc"
      class="cursor"
    />

  </g>


  <!-- FLOATING DETAILS -->

  <circle
    cx="90"
    cy="115"
    r="2"
    fill="#c084fc"
    class="particle1"
  />

  <circle
    cx="805"
    cy="150"
    r="2"
    fill="#9333ea"
    class="particle2"
  />

  <circle
    cx="115"
    cy="570"
    r="1.5"
    fill="#c084fc"
    class="particle2"
  />

  <circle
    cx="790"
    cy="600"
    r="1.5"
    fill="#a855f7"
    class="particle1"
  />


  <!-- MOVING SCANNER -->

  <rect
    x="0"
    y="693"
    width="180"
    height="1"
    fill="url(#purpleLine)"
    opacity=".8"
    filter="url(#glow)"
    class="scanner"
  />


  <!-- CRT SCANLINES -->

  <rect
    x="8"
    y="8"
    width="884"
    height="704"
    rx="16"
    fill="url(#scanlines)"
    pointer-events="none"
  />

</svg>
