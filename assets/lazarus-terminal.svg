<svg width="900" height="430" viewBox="0 0 900 430"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070c"/>
      <stop offset="55%" stop-color="#0d0715"/>
      <stop offset="100%" stop-color="#160624"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity=".025"/>
    </pattern>
  </defs>

  <style>
    .mono {
      font-family: "JetBrains Mono", "Courier New", monospace;
    }

    .purple {
      fill: #c084fc;
    }

    .green {
      fill: #55ff88;
    }

    .white {
      fill: #e5e7eb;
    }

    .muted {
      fill: #8b8b9e;
    }

    .line {
      opacity: 0;
      animation: show 14s infinite;
    }

    .l1  { animation-delay: .5s; }
    .l2  { animation-delay: 1.3s; }
    .l3  { animation-delay: 2.1s; }
    .l4  { animation-delay: 2.9s; }
    .l5  { animation-delay: 3.7s; }
    .l6  { animation-delay: 4.5s; }
    .l7  { animation-delay: 5.3s; }
    .l8  { animation-delay: 6.1s; }
    .l9  { animation-delay: 6.9s; }
    .l10 { animation-delay: 7.7s; }
    .l11 { animation-delay: 8.5s; }
    .l12 { animation-delay: 9.3s; }

    @keyframes show {
      0%   { opacity: 0; transform: translateY(3px); }
      4%   { opacity: 1; transform: translateY(0); }
      82%  { opacity: 1; }
      96%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .cursor {
      animation: blink .7s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .progress {
      transform-origin: left;
      animation: load 14s infinite;
    }

    @keyframes load {
      0%   { transform: scaleX(0); }
      62%  { transform: scaleX(0); }
      76%  { transform: scaleX(1); }
      94%  { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }

    .status {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: .6; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Main terminal -->
  <rect x="8" y="8" width="884" height="414"
        rx="14"
        fill="url(#bg)"
        stroke="#9333ea"
        stroke-width="2"/>

  <!-- Purple glow -->
  <rect x="9" y="9" width="882" height="412"
        rx="14"
        fill="none"
        stroke="#a855f7"
        opacity=".28"
        filter="url(#glow)"/>

  <!-- Top bar -->
  <rect x="8" y="8" width="884" height="48"
        rx="14"
        fill="#10091a"/>

  <line x1="8" y1="56" x2="892" y2="56"
        stroke="#6b21a8"
        opacity=".8"/>

  <circle cx="35" cy="32" r="6" fill="#ef4444"/>
  <circle cx="56" cy="32" r="6" fill="#eab308"/>
  <circle cx="77" cy="32" r="6" fill="#22c55e"/>

  <text x="105" y="38"
        class="mono purple"
        font-size="15"
        font-weight="700">
    LAZARUS_TERMINAL.exe
  </text>

  <text x="820" y="38"
        class="mono muted"
        font-size="12">
    v2.0.0
  </text>


  <!-- LEFT TERMINAL -->

  <text x="35" y="88" class="mono purple line l1" font-size="14">
    &gt; awakening LAZARUS protocol...
  </text>

  <text x="35" y="112" class="mono green line l2" font-size="14">
    ✓ core consciousness detected
  </text>

  <text x="35" y="136" class="mono purple line l3" font-size="14">
    &gt; sudo resurrect --empire
  </text>

  <text x="35" y="160" class="mono white line l4" font-size="14">
    loading forbidden_modules.dll...
  </text>

  <text x="35" y="184" class="mono purple line l5" font-size="14">
    &gt; scanning memory sectors...
  </text>

  <text x="35" y="208" class="mono green line l6" font-size="14">
    ✓ 69,420 bytes of chaos found
  </text>

  <text x="35" y="232" class="mono purple line l7" font-size="14">
    &gt; rm -rf /bugs/*
  </text>

  <text x="35" y="256" class="mono green line l8" font-size="14">
    ✓ bugs deleted... probably
  </text>

  <text x="35" y="280" class="mono purple line l9" font-size="14">
    &gt; ./programmer --coffee=MAX
  </text>

  <text x="35" y="304" class="mono white line l10" font-size="14">
    coffee++; sleep--;
  </text>

  <text x="35" y="328" class="mono purple line l11" font-size="14">
    &gt; while(alive) { build(); break(); rebuild(); }
  </text>

  <text x="35" y="352"
        class="mono green line l12"
        font-size="15"
        font-weight="700"
        filter="url(#glow)">
    LAZARUS EMPIRES // RESURRECTED
  </text>


  <!-- RIGHT PANEL -->

  <rect x="605" y="82" width="255" height="216"
        rx="8"
        fill="#090711"
        stroke="#6b21a8"/>

  <text x="625" y="108"
        class="mono purple"
        font-size="13">
    user@lazarus:~$ neofetch
  </text>

  <text x="625" y="137"
        class="mono white"
        font-size="12">
    OS: Lazarus OS
  </text>

  <text x="625" y="157"
        class="mono white"
        font-size="12">
    Kernel: 6.9.69-lazarus
  </text>

  <text x="625" y="177"
        class="mono white"
        font-size="12">
    Uptime: ∞
  </text>

  <text x="625" y="197"
        class="mono white"
        font-size="12">
    Shell: chaos.sh
  </text>

  <text x="625" y="217"
        class="mono white"
        font-size="12">
    CPU: curiosity @ MAX
  </text>

  <text x="625" y="237"
        class="mono white"
        font-size="12">
    RAM: 69420MB
  </text>

  <text x="625" y="257"
        class="mono white"
        font-size="12">
    Theme: Dark Purple
  </text>

  <text x="625" y="277"
        class="mono green status"
        font-size="12"
        font-weight="700">
    ● STATUS: AWAKENED
  </text>


  <!-- Progress -->
  <text x="35" y="386"
        class="mono muted"
        font-size="11">
    resurrection progress
  </text>

  <rect x="180" y="376"
        width="410" height="11"
        rx="5"
        fill="#251632"/>

  <rect x="180" y="376"
        width="410" height="11"
        rx="5"
        fill="url(#bar)"
        class="progress"
        filter="url(#glow)"/>

  <text x="610" y="386"
        class="mono green"
        font-size="11">
    SECURE
  </text>

  <text x="760" y="386"
        class="mono purple"
        font-size="11">
    GOD MODE
  </text>


  <!-- blinking cursor -->
  <rect x="382" y="340"
        width="8"
        height="15"
        fill="#55ff88"
        class="cursor"/>

  <!-- CRT effect -->
  <rect x="8" y="8"
        width="884" height="414"
        rx="14"
        fill="url(#scanlines)"
        pointer-events="none"/>

</svg>
