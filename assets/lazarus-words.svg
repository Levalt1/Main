    <!-- handle wrap -->

    <path d="
      M789 372 L801 381
      M789 383 L801 392
      M789 394 L801 403
      M789 405 L801 414
      M789 416 L801 425"
      stroke="#c084fc"
      stroke-width="1.3"
      opacity=".7"/>


    <!-- pommel -->

    <circle cx="795"
            cy="445"
            r="11"
            class="guard"/>

    <circle cx="795"
            cy="445"
            r="5"
            class="gem"/>

  </g>


  <!-- ======================================== -->
  <!-- QUOTE                                    -->
  <!-- ======================================== -->

  <text x="450"
        y="150"
        text-anchor="middle"
        class="serif white quote q1"
        font-size="13"
        font-style="italic">

    When I was sixteen, I won a great victory.

  </text>


  <text x="450"
        y="174"
        text-anchor="middle"
        class="serif white quote q2"
        font-size="13"
        font-style="italic">

    I felt in that moment I would live to be a hundred.

  </text>


  <text x="450"
        y="198"
        text-anchor="middle"
        class="serif white quote q3"
        font-size="13"
        font-style="italic">

    Now I know I shall not see thirty.

  </text>


  <text x="450"
        y="235"
        text-anchor="middle"
        class="serif muted quote q4"
        font-size="12.5"
        font-style="italic">

    None of us know our end, really,

  </text>


  <text x="450"
        y="258"
        text-anchor="middle"
        class="serif muted quote q5"
        font-size="12.5"
        font-style="italic">

    or what hand will guide us there.

  </text>


  <text x="450"
        y="298"
        text-anchor="middle"
        class="serif white quote q6"
        font-size="12.5"
        font-style="italic">

    A king may move a man, a father may claim a son,

  </text>


  <text x="450"
        y="321"
        text-anchor="middle"
        class="serif white quote q7"
        font-size="12.5"
        font-style="italic">

    but that man can also move himself,

  </text>


  <text x="450"
        y="344"
        text-anchor="middle"
        class="serif white quote q8"
        font-size="12.5"
        font-style="italic">

    and only then does that man truly begin his own game.

  </text>


  <text x="450"
        y="384"
        text-anchor="middle"
        class="serif muted quote q9"
        font-size="12.5"
        font-style="italic">

    Remember that howsoever you are played or by whom,

  </text>


  <text x="450"
        y="407"
        text-anchor="middle"
        class="serif muted quote q10"
        font-size="12.5"
        font-style="italic">

    your soul is in your keeping alone.

  </text>


