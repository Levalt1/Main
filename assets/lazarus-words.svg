    LAZARUS // MEMORY ARCHIVE

  </text>


  <text x="760"
        y="38"
        class="mono purple"
        font-size="10">

    ARCHIVE_004

  </text>


  <circle cx="846"
          cy="34"
          r="4"
          fill="#55ff88"
          class="status"/>


  <text x="858"
        y="38"
        class="mono green"
        font-size="9">

    ONLINE

  </text>


  <line x1="30"
        y1="55"
        x2="870"
        y2="55"
