<svg width="900" height="540" viewBox="0 0 900 540"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050509"/>
      <stop offset="50%" stop-color="#0d0615"/>
      <stop offset="100%" stop-color="#170522"/>
    </linearGradient>

    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="35%" stop-color="#f4f4f5"/>
      <stop offset="60%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <radialGradient id="gem">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e9d5ff"/>
      <stop offset="65%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#581c87"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines"
             width="4"
             height="4"
             patternUnits="userSpaceOnUse">
      <rect width="4"
            height="1"
            fill="#ffffff"
            opacity=".018"/>
    </pattern>

  </defs>


  <style>

    .mono {
      font-family: "JetBrains Mono", "Courier New", monospace;
    }

    .serif {
      font-family: Georgia, "Times New Roman", serif;
    }

    .white {
      fill: #f4f4f5;
    }

    .purple {
      fill: #c084fc;
    }

    .muted {
      fill: #a1a1aa;
    }

    .green {
      fill: #55ff88;
    }


    /* ============================= */
    /* QUOTE ANIMATION               */
    /* ============================= */

    .quote {
      opacity: 0;
      animation: reveal 18s infinite;
    }

    .q1 { animation-delay: .8s; }
    .q2 { animation-delay: 1.6s; }
    .q3 { animation-delay: 2.4s; }
    .q4 { animation-delay: 3.4s; }
    .q5 { animation-delay: 4.2s; }
    .q6 { animation-delay: 5.2s; }
    .q7 { animation-delay: 6.0s; }
    .q8 { animation-delay: 6.8s; }
    .q9 { animation-delay: 7.8s; }
    .q10 { animation-delay: 8.6s; }


    @keyframes reveal {

      0% {
        opacity: 0;
        transform: translateY(5px);
      }

      5% {
        opacity: 1;
        transform: translateY(0);
      }

      82% {
        opacity: 1;
      }

      96%,100% {
        opacity: 0;
      }

    }


    /* ============================= */
    /* AUTHOR                        */
    /* ============================= */

    .author {
      opacity: 0;
      animation: author 18s infinite;
    }

    @keyframes author {

      0%,53% {
        opacity: 0;
      }

      60%,90% {
        opacity: 1;
      }

      97%,100% {
        opacity: 0;
      }

    }


    /* ============================= */
    /* SWORDS                        */
    /* ============================= */

    .sword-left {
      transform-origin: 105px 285px;
      animation: swordLeft 4s ease-in-out infinite;
    }

    .sword-right {
      transform-origin: 795px 285px;
      animation: swordRight 4s ease-in-out infinite;
    }

    @keyframes swordLeft {

      0%,100% {
        transform: rotate(-3deg) translateY(0);
      }

      50% {
        transform: rotate(-1deg) translateY(-5px);
      }

    }

    @keyframes swordRight {

      0%,100% {
        transform: rotate(3deg) translateY(0);
      }

      50% {
        transform: rotate(1deg) translateY(-5px);
      }

    }


    .blade {
      fill: url(#blade);
      stroke: #c084fc;
      stroke-width: 2;
    }

    .blade-center {
      stroke: #ffffff;
      stroke-width: 1;
      opacity: .65;
    }

    .guard {
      fill: #111118;
      stroke: #c084fc;
      stroke-width: 2;
    }

    .handle {
      fill: #180d20;
      stroke: #9333ea;
      stroke-width: 1.5;
    }

    .gem {
      fill: url(#gem);
      animation: gemPulse 1.7s ease-in-out infinite;
    }

    @keyframes gemPulse {

      0%,100% {
        opacity: .55;
      }

      50% {
        opacity: 1;
        filter: url(#strongGlow);
      }

    }


    /* ============================= */
    /* ENERGY AROUND SWORDS          */
    /* ============================= */

    .energy {
      fill: none;
      stroke: #a855f7;
      stroke-width: 1.5;
      opacity: 0;
      animation: energy 2.4s ease-in-out infinite;
    }

    @keyframes energy {

      0%,100% {
        opacity: .1;
      }

      50% {
        opacity: .9;
      }

    }


    /* ============================= */
    /* TITLE                         */
    /* ============================= */

    .title {
      animation: titleGlow 2.5s ease-in-out infinite;
    }

    @keyframes titleGlow {

      0%,100% {
        opacity: .75;
      }

      50% {
        opacity: 1;
        filter: url(#glow);
      }

    }


    /* ============================= */
    /* STATUS                        */
    /* ============================= */

    .status {
      animation: statusPulse 1.5s ease-in-out infinite;
    }

    @keyframes statusPulse {

      0%,100% {
        opacity: .45;
      }

      50% {
        opacity: 1;
      }

    }


    /* ============================= */
    /* LOADING BAR                   */
    /* ============================= */

    .progress {
      transform-origin: left;
      animation: load 18s infinite;
    }

    @keyframes load {

      0% {
        transform: scaleX(0);
      }

      20% {
        transform: scaleX(.2);
      }

      45% {
        transform: scaleX(.5);
      }

      65% {
        transform: scaleX(.8);
      }

      78% {
        transform: scaleX(1);
      }

      94% {
        transform: scaleX(1);
      }

      100% {
        transform: scaleX(0);
      }

    }


    /* ============================= */
    /* PARTICLES                     */
    /* ============================= */

    .p1 {
      animation: particle1 5s ease-in-out infinite;
    }

    .p2 {
      animation: particle2 6s ease-in-out infinite;
    }

    @keyframes particle1 {

      0%,100% {
        transform: translateY(0);
        opacity: .2;
      }

      50% {
        transform: translateY(-15px);
        opacity: .9;
      }

    }

    @keyframes particle2 {

      0%,100% {
        transform: translateY(0);
        opacity: .15;
      }

      50% {
        transform: translateY(12px);
        opacity: .7;
      }

    }


    /* ============================= */
    /* BOTTOM SCANNER                */
    /* ============================= */

    .scanner {
      animation: scanner 4s linear infinite;
    }

    @keyframes scanner {

      from {
        transform: translateX(-200px);
      }

      to {
        transform: translateX(1100px);
      }

    }

  </style>


  <!-- ======================================== -->
  <!-- BACKGROUND                               -->
  <!-- ======================================== -->

  <rect x="8"
        y="8"
        width="884"
        height="524"
        rx="16"
        fill="url(#bg)"
        stroke="#7e22ce"
        stroke-width="2"/>


  <rect x="10"
        y="10"
        width="880"
        height="520"
        rx="15"
        fill="none"
        stroke="#a855f7"
        opacity=".18"
        filter="url(#glow)"/>


  <!-- ======================================== -->
  <!-- HEADER                                   -->
  <!-- ======================================== -->

  <text x="30"
        y="38"
        class="mono purple"
