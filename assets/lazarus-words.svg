        opacity=".55"/>


  <!-- ======================================== -->
  <!-- TITLE                                    -->
  <!-- ======================================== -->

  <text x="450"
        y="96"
        text-anchor="middle"
        class="serif purple title"
        font-size="26"
        letter-spacing="5">

    WORDS I REMEMBER

  </text>


  <line x1="280"
        y1="112"
        x2="420"
        y2="112"
        stroke="#7e22ce"
        opacity=".7"/>

  <polygon points="450,106 456,112 450,118 444,112"
           fill="#c084fc"
           filter="url(#glow)"/>

  <line x1="480"
        y1="112"
        x2="620"
        y2="112"
        stroke="#7e22ce"
        opacity=".7"/>


  <!-- ======================================== -->
  <!-- LEFT SWORD                               -->
  <!-- ======================================== -->

  <g class="sword-left">

    <!-- energy -->

    <path d="
      M94 135
