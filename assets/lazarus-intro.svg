<svg width="900" height="360" viewBox="0 0 900 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050509"/>
      <stop offset="50%" stop-color="#0d0615"/>
      <stop offset="100%" stop-color="#170722"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity=".02"/>
    </pattern>
  </defs>

  <style>

    .mono {
      font-family: "JetBrains Mono", "Courier New", monospace;
    }

    .title {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
    }

    .purple {
      fill: #c084fc;
    }

    .white {
      fill: #f4f4f5;
    }

    .muted {
      fill: #a1a1aa;
    }

    /* MAIN TITLE */

    .hello {
      opacity: 0;
      animation: hello 10s infinite;
    }

    @keyframes hello {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }

      8% {
        opacity: 1;
        transform: translateY(0);
      }

      92% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    /* SUBTITLE */

    .subtitle {
      opacity: 0;
      animation: subtitle 10s infinite;
    }

    @keyframes subtitle {
      0%, 12% {
        opacity: 0;
        transform: translateY(8px);
      }

      20%, 92% {
        opacity: 1;
        transform: translateY(0);
      }

      100% {
        opacity: 0;
      }
    }

    /* PHILOSOPHY */

    .philosophy {
      opacity: 0;
      animation: philosophy 10s infinite;
    }

    @keyframes philosophy {
      0%, 25% {
        opacity: 0;
      }

      34%, 92% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    /* QUOTES */

    .quote1 {
      opacity: 0;
      animation: quote1 10s infinite;
    }

    @keyframes quote1 {
      0%, 38% {
        opacity: 0;
      }

      47%, 92% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    .quote2 {
      opacity: 0;
      animation: quote2 10s infinite;
    }

    @keyframes quote2 {
      0%, 50% {
        opacity: 0;
      }

      60%, 92% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    /* LAZARUS STATUS */

    .status {
      opacity: 0;
      animation: status 10s infinite;
    }

    @keyframes status {
      0%, 65% {
        opacity: 0;
      }

      72%, 92% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    /* BLINKING CURSOR */

    .cursor {
      animation: blink .7s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* MOVING LASER */

    .laser {
      animation: laser 4s linear infinite;
    }

    @keyframes laser {
      from {
        transform: translateX(-700px);
      }

      to {
        transform: translateX(1000px);
      }
    }

    /* FLOATING PARTICLES */

    .p1 {
      animation: float1 5s ease-in-out infinite;
    }

    .p2 {
      animation: float2 6s ease-in-out infinite;
    }

    .p3 {
      animation: float1 7s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% {
        transform: translateY(0);
        opacity: .25;
      }

      50% {
        transform: translateY(-12px);
        opacity: .8;
      }
    }

    @keyframes float2 {
      0%, 100% {
        transform: translateY(0);
        opacity: .15;
      }

      50% {
        transform: translateY(10px);
        opacity: .7;
      }
    }

    /* PULSE */

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: .35;
      }

      50% {
        opacity: 1;
      }
    }

  </style>


  <!-- BACKGROUND -->

  <rect x="8" y="8"
        width="884"
        height="344"
        rx="16"
        fill="url(#bg)"
        stroke="#7e22ce"
        stroke-width="2"/>


  <!-- DECORATIVE PARTICLES -->

  <circle class="p1"
          cx="80"
          cy="90"
          r="2"
          fill="#c084fc"/>

  <circle class="p2"
          cx="150"
          cy="280"
          r="2"
          fill="#9333ea"/>

  <circle class="p3"
          cx="790"
          cy="100"
          r="2"
          fill="#c084fc"/>

  <circle class="p1"
          cx="835"
          cy="260"
          r="1.5"
          fill="#a855f7"/>

  <circle class="p2"
          cx="720"
          cy="310"
          r="1.5"
          fill="#c084fc"/>


  <!-- TOP SYSTEM BAR -->

  <text x="32"
        y="39"
        class="mono purple"
        font-size="12">

    LEVALT // LAZARUS

  </text>

  <circle cx="840"
          cy="34"
          r="4"
          fill="#55ff88"
          class="pulse"/>

  <text x="850"
        y="39"
        class="mono muted"
        font-size="10">

    ONLINE

  </text>

  <line x1="30"
        y1="54"
        x2="870"
        y2="54"
        stroke="#581c87"
        opacity=".5"/>


  <!-- MAIN INTRO -->

  <g class="hello">

    <text x="450"
          y="118"
          text-anchor="middle"
          class="title white"
          font-size="38">

      Hi there, I'm

      <tspan fill="#c084fc">LeValt</tspan>

    </text>

  </g>


  <!-- SUBTITLE -->

  <text x="450"
        y="158"
        text-anchor="middle"
        class="mono purple subtitle"
        font-size="17">

    Learn To Love Myself Before Loving Someone Else

  </text>


  <!-- PHILOSOPHY -->

  <text x="450"
        y="197"
        text-anchor="middle"
        class="mono muted philosophy"
        font-size="13">

    &gt; Love to establish new things and destroy them_

  </text>


  <!-- QUOTE ONE -->

  <text x="450"
        y="240"
        text-anchor="middle"
        class="mono white quote1"
        font-size="13">

    "I have no special talent. I am only passionately curious."

  </text>


  <!-- QUOTE TWO -->

  <text x="450"
        y="266"
        text-anchor="middle"
        class="mono muted quote2"
        font-size="11">

    "The important thing is not to stop questioning."

  </text>


  <!-- FINAL STATUS -->

  <g class="status">

    <text x="450"
          y="310"
          text-anchor="middle"
          class="mono purple"
          font-size="12"
          font-weight="700"
          filter="url(#glow)">

      [ IDENTITY VERIFIED // WELCOME TO LAZARUS ]

    </text>

    <rect x="674"
          y="298"
          width="7"
          height="14"
          fill="#c084fc"
          class="cursor"/>

  </g>


  <!-- MOVING LIGHT -->

  <rect class="laser"
        x="0"
        y="329"
        width="170"
        height="1"
        fill="url(#purple)"
        opacity=".8"
        filter="url(#glow)"/>


  <!-- SCANLINES -->

  <rect x="8"
        y="8"
        width="884"
        height="344"
        rx="16"
        fill="url(#scan)"
        pointer-events="none"/>

</svg>
