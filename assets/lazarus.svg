  <text x="485" y="470" class="ui purple" font-size="17" font-weight="700">⌘ ML / Vision</text>
  <text x="485" y="496" class="ui muted" font-size="13">PyTorch · TensorFlow · OpenCV · NumPy · Pandas</text>
</g>

<line x1="55" y1="1100" x2="845" y2="1100" stroke="url(#purple)" opacity=".45"/>

