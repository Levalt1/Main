  <text x="65" y="240" class="ui purple" font-size="17" font-weight="700">▤ Backend &amp; APIs</text>
  <text x="65" y="266" class="ui muted" font-size="13">Node.js · NestJS · Fastify · Bun · Express</text>
  <text x="65" y="288" class="ui muted" font-size="13">Django · FastAPI · Flask</text>
  <text x="65" y="310" class="ui muted" font-size="13">REST · GraphQL · WebSockets · gRPC</text>
  <text x="65" y="332" class="ui muted" font-size="13">JWT · OAuth2 · Authentication Systems</text>

  <text x="65" y="377" class="ui purple" font-size="17" font-weight="700">▣ Frontend</text>
