<svg width="900" height="2380" viewBox="0 0 900 2380"
     xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050509"/>
    <stop offset="52%" stop-color="#0d0615"/>
    <stop offset="100%" stop-color="#170522"/>
  </linearGradient>

  <linearGradient id="purple" x1="0" x2="1">
    <stop offset="0%" stop-color="#581c87"/>
    <stop offset="50%" stop-color="#c084fc"/>
    <stop offset="100%" stop-color="#581c87"/>
  </linearGradient>

  <linearGradient id="blade" x1="0" x2="1">
    <stop offset="0%" stop-color="#52525b"/>
    <stop offset="40%" stop-color="#f4f4f5"/>
    <stop offset="65%" stop-color="#d8b4fe"/>
    <stop offset="100%" stop-color="#52525b"/>
  </linearGradient>

  <radialGradient id="gem">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="35%" stop-color="#e9d5ff"/>
    <stop offset="70%" stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#581c87"/>
  </radialGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity=".018"/>
  </pattern>
</defs>

<style>
  .mono { font-family:"JetBrains Mono","Courier New",monospace; }
  .ui { font-family:Arial,Helvetica,sans-serif; }
  .serif { font-family:Georgia,"Times New Roman",serif; }
  .white { fill:#f4f4f5; }
  .muted { fill:#a1a1aa; }
  .purple { fill:#c084fc; }
  .green { fill:#55ff88; }
  .panel { fill:#090711; stroke:#552273; stroke-width:1.2; }
  .sectionTitle { fill:#c084fc; font-weight:700; letter-spacing:2px; }
  .small { font-size:10px; }

  .pulse { animation:pulse 1.7s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }

  .titleGlow { animation:titleGlow 2.6s ease-in-out infinite; }
  @keyframes titleGlow {
    0%,100%{opacity:.72}
    50%{opacity:1;filter:url(#glow)}
  }

  .scanner { animation:scan 5s linear infinite; }
  @keyframes scan {
    from{transform:translateX(-220px)}
    to{transform:translateX(1120px)}
  }

  .float { animation:float 4s ease-in-out infinite; }
  @keyframes float {
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-5px)}
  }

  .reveal { opacity:0; animation:reveal 18s infinite; }
  .r1{animation-delay:.4s}.r2{animation-delay:1.2s}.r3{animation-delay:2s}
  .r4{animation-delay:2.8s}.r5{animation-delay:3.6s}.r6{animation-delay:4.4s}
  .r7{animation-delay:5.2s}.r8{animation-delay:6s}.r9{animation-delay:6.8s}
  .r10{animation-delay:7.6s}.r11{animation-delay:8.4s}.r12{animation-delay:9.2s}

  @keyframes reveal {
    0%{opacity:0;transform:translateY(5px)}
    5%{opacity:1;transform:translateY(0)}
    82%{opacity:1}
    96%,100%{opacity:0}
  }

  .swordL { transform-origin:90px 1270px; animation:swordL 4s ease-in-out infinite; }
  .swordR { transform-origin:810px 1270px; animation:swordR 4s ease-in-out infinite; }
  @keyframes swordL { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(-1deg) translateY(-5px)} }
  @keyframes swordR { 0%,100%{transform:rotate(3deg)} 50%{transform:rotate(1deg) translateY(-5px)} }

  .eq1{animation:eq1 .6s ease-in-out infinite alternate;transform-origin:bottom}
  .eq2{animation:eq2 .8s ease-in-out infinite alternate;transform-origin:bottom}
  .eq3{animation:eq3 .5s ease-in-out infinite alternate;transform-origin:bottom}
  @keyframes eq1{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
  @keyframes eq2{from{transform:scaleY(.5)}to{transform:scaleY(1.25)}}
  @keyframes eq3{from{transform:scaleY(.25)}to{transform:scaleY(.85)}}

  .progress { transform-origin:left; animation:load 14s infinite; }
  @keyframes load {
    0%{transform:scaleX(0)}
    25%{transform:scaleX(.25)}
    55%{transform:scaleX(.6)}
    80%{transform:scaleX(1)}
    94%{transform:scaleX(1)}
    100%{transform:scaleX(0)}
  }
</style>

<!-- MAIN BACKGROUND -->
<rect x="8" y="8" width="884" height="2364" rx="20" fill="url(#bg)" stroke="#7e22ce" stroke-width="2"/>
<rect x="10" y="10" width="880" height="2360" rx="18" fill="none" stroke="#a855f7" opacity=".18" filter="url(#glow)"/>

<!-- GLOBAL HEADER -->
<text x="30" y="38" class="mono purple small">LAZARUS // PERSONAL INTERFACE</text>
<circle cx="820" cy="34" r="4" fill="#55ff88" class="pulse"/>
<text x="832" y="38" class="mono green" font-size="9">ONLINE</text>
<line x1="30" y1="55" x2="870" y2="55" stroke="url(#purple)" opacity=".55"/>

<!-- ================= PROFILE ================= -->
<g transform="translate(0 70)">
  <text x="450" y="70" text-anchor="middle" class="ui white titleGlow" font-size="34" font-weight="700">Hi there 👋, I'm LeValt</text>
  <text x="450" y="105" text-anchor="middle" class="serif purple" font-size="18" font-style="italic">Learn To Love Myself Before Loving Someone Else</text>
  <text x="450" y="138" text-anchor="middle" class="mono muted" font-size="12">&gt; Love to establish new things and destroy them 🕵</text>

  <rect x="55" y="175" width="790" height="245" rx="14" class="panel"/>
  <text x="80" y="210" class="mono purple" font-size="12">ABOUT_ME.init()</text>
  <text x="80" y="250" class="ui white reveal r1" font-size="15">Programming · Reverse Engineering · Cybersecurity</text>
  <text x="80" y="282" class="ui muted reveal r2" font-size="14">Curious about how things work beneath the surface.</text>
  <text x="80" y="314" class="ui muted reveal r3" font-size="14">Build → Break → Understand → Rebuild.</text>
  <text x="80" y="346" class="ui muted reveal r4" font-size="14">Learning C++, Lua, Assembly, Unity &amp; Game Development.</text>

  <line x1="80" y1="372" x2="820" y2="372" stroke="#3b1b4c"/>
  <text x="450" y="395" text-anchor="middle" class="serif white" font-size="12" font-style="italic">“I have no special talent. I am only passionately curious.”</text>
  <text x="450" y="417" text-anchor="middle" class="serif muted" font-size="11" font-style="italic">The important thing is not to stop questioning.</text>
</g>

<!-- SECTION DIVIDER -->
<line x1="55" y1="535" x2="845" y2="535" stroke="url(#purple)" opacity=".45"/>

<!-- ================= TECH STACK ================= -->
<g transform="translate(0 555)">
  <text x="450" y="45" text-anchor="middle" class="ui sectionTitle titleGlow" font-size="26">TECH STACK</text>
  <text x="450" y="68" text-anchor="middle" class="mono muted" font-size="10">TOOLS I REACH FOR TO BUILD, BREAK, REVERSE &amp; SHIP</text>

  <line x1="450" y1="95" x2="450" y2="515" stroke="#3f294b" opacity=".6"/>

  <!-- left -->
  <text x="65" y="125" class="ui purple" font-size="17" font-weight="700">⌘ Languages</text>
  <text x="65" y="151" class="ui muted" font-size="13">C · C++ · C# · Rust · Go · Python</text>
  <text x="65" y="173" class="ui muted" font-size="13">TypeScript · JavaScript · Dart · Java · Kotlin</text>
