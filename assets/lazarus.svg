    <rect x="84" y="400" width="12" height="60" rx="4" fill="#180d20" stroke="#9333ea"/>
    <circle cx="90" cy="469" r="10" fill="#111118" stroke="#c084fc"/>
    <circle cx="90" cy="469" r="4" fill="url(#gem)" class="pulse"/>
  </g>

  <g class="swordR">
    <path d="M810 95 L823 125 L818 360 L810 382 L802 360 L797 125 Z" fill="url(#blade)" stroke="#c084fc" stroke-width="2" filter="url(#glow)"/>
    <line x1="810" y1="118" x2="810" y2="350" stroke="#fff" opacity=".5"/>
    <path d="M810 372 L794 362 L778 370 L768 363 L776 381 L797 386 L810 400 L823 386 L844 381 L852 363 L842 370 L826 362 Z" fill="#111118" stroke="#c084fc" stroke-width="2"/>
    <polygon points="810,373 821,384 810,396 799,384" fill="url(#gem)" filter="url(#glow)"/>
    <rect x="804" y="400" width="12" height="60" rx="4" fill="#180d20" stroke="#9333ea"/>
    <circle cx="810" cy="469" r="10" fill="#111118" stroke="#c084fc"/>
    <circle cx="810" cy="469" r="4" fill="url(#gem)" class="pulse"/>
  </g>

  <text x="450" y="125" text-anchor="middle" class="serif white reveal r1" font-size="13" font-style="italic">When I was sixteen, I won a great victory.</text>
  <text x="450" y="150" text-anchor="middle" class="serif white reveal r2" font-size="13" font-style="italic">I felt in that moment I would live to be a hundred.</text>
  <text x="450" y="175" text-anchor="middle" class="serif white reveal r3" font-size="13" font-style="italic">Now I know I shall not see thirty.</text>

  <text x="450" y="215" text-anchor="middle" class="serif muted reveal r4" font-size="12.5" font-style="italic">None of us know our end, really,</text>
  <text x="450" y="239" text-anchor="middle" class="serif muted reveal r5" font-size="12.5" font-style="italic">or what hand will guide us there.</text>

  <text x="450" y="285" text-anchor="middle" class="serif white reveal r6" font-size="12.5" font-style="italic">A king may move a man, a father may claim a son,</text>
  <text x="450" y="309" text-anchor="middle" class="serif white reveal r7" font-size="12.5" font-style="italic">but that man can also move himself,</text>
  <text x="450" y="333" text-anchor="middle" class="serif white reveal r8" font-size="12.5" font-style="italic">and only then does that man truly begin his own game.</text>

  <text x="450" y="379" text-anchor="middle" class="serif muted reveal r9" font-size="12.5" font-style="italic">Remember that howsoever you are played or by whom,</text>
  <text x="450" y="403" text-anchor="middle" class="serif muted reveal r10" font-size="12.5" font-style="italic">your soul is in your keeping alone.</text>

  <text x="450" y="455" text-anchor="middle" class="serif purple titleGlow" font-size="16" letter-spacing="3">— KING BALDWIN IV —</text>
</g>

