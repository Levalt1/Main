  <text x="65" y="470" class="ui purple" font-size="17" font-weight="700">▯ Mobile</text>
  <text x="65" y="496" class="ui muted" font-size="13">Flutter · React Native · Android</text>

  <!-- right -->
  <text x="485" y="125" class="ui purple" font-size="17" font-weight="700">◉ Databases</text>
  <text x="485" y="151" class="ui muted" font-size="13">PostgreSQL · MySQL · MariaDB · MongoDB</text>
  <text x="485" y="173" class="ui muted" font-size="13">SQLite · Redis · Supabase · Firebase</text>
  <text x="485" y="195" class="ui muted" font-size="13">Prisma · TypeORM · Sequelize</text>

  <text x="485" y="240" class="ui purple" font-size="17" font-weight="700">◈ Infra &amp; DevOps</text>
  <text x="485" y="266" class="ui muted" font-size="13">Docker · Nginx · GitHub Actions · CI/CD · PM2</text>
  <text x="485" y="288" class="ui muted" font-size="13">Vercel · Netlify · Sentry · Datadog</text>
  <text x="485" y="310" class="ui muted" font-size="13">Bash · Make · PowerShell</text>

  <text x="485" y="355" class="ui purple" font-size="17" font-weight="700">▧ Reverse Engineering</text>
  <text x="485" y="381" class="ui muted" font-size="13">x86 · ARM Assembly · Ghidra · IDA</text>
  <text x="485" y="403" class="ui muted" font-size="13">Binary Ninja · Radare2 · Instrumentation</text>
