<svg width="900" height="260" viewBox="0 0 900 260"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050509"/>
      <stop offset="50%" stop-color="#0d0615"/>
      <stop offset="100%" stop-color="#170522"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines"
             width="4"
             height="4"
             patternUnits="userSpaceOnUse">

      <rect width="4"
            height="1"
            fill="#ffffff"
            opacity=".018"/>

    </pattern>

  </defs>

  <style>

    .mono {
      font-family: "JetBrains Mono", "Courier New", monospace;
    }

    .ui {
      font-family: Arial, Helvetica, sans-serif;
    }

    .purple {
      fill: #c084fc;
    }

    .green {
      fill: #55ff88;
    }

    .white {
      fill: #f4f4f5;
    }

    .muted {
      fill: #a1a1aa;
    }


    /* TITLE */

    .title {
      animation: titleGlow 2.5s ease-in-out infinite;
    }

    @keyframes titleGlow {
      0%,100% {
        opacity: .7;
      }

      50% {
        opacity: 1;
        filter: url(#glow);
      }
    }


    /* DISC */

    .disc {
      transform-origin: 160px 150px;
      animation: spin 10s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    /* STATUS */

    .status {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% {
        opacity: .35;
      }

      50% {
        opacity: 1;
      }
    }


    /* BARS */

    .b1 {
      animation: bar1 .6s ease-in-out infinite alternate;
      transform-origin: bottom;
    }

    .b2 {
      animation: bar2 .8s ease-in-out infinite alternate;
      transform-origin: bottom;
    }

    .b3 {
      animation: bar3 .5s ease-in-out infinite alternate;
      transform-origin: bottom;
    }

    .b4 {
      animation: bar4 .7s ease-in-out infinite alternate;
      transform-origin: bottom;
    }

    .b5 {
      animation: bar5 .9s ease-in-out infinite alternate;
      transform-origin: bottom;
    }

    @keyframes bar1 {
      from { transform: scaleY(.3); }
      to   { transform: scaleY(1); }
    }

    @keyframes bar2 {
      from { transform: scaleY(.5); }
      to   { transform: scaleY(1.3); }
    }

    @keyframes bar3 {
      from { transform: scaleY(.25); }
      to   { transform: scaleY(.8); }
    }

    @keyframes bar4 {
      from { transform: scaleY(.4); }
      to   { transform: scaleY(1.15); }
    }

    @keyframes bar5 {
      from { transform: scaleY(.2); }
      to   { transform: scaleY(.9); }
    }


    /* NOTES */

    .note1 {
      animation: noteFloat1 4s ease-in-out infinite;
    }

    .note2 {
      animation: noteFloat2 5s ease-in-out infinite;
    }

    @keyframes noteFloat1 {
      0%,100% {
        opacity: .2;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-15px);
      }
    }

    @keyframes noteFloat2 {
      0%,100% {
        opacity: .15;
        transform: translateY(0);
      }

      50% {
        opacity: .8;
        transform: translateY(-10px);
      }
    }


    /* PROGRESS */

    .progress {
      transform-origin: left;
      animation: progress 8s linear infinite;
    }

    @keyframes progress {
      0% {
        transform: scaleX(.05);
      }

      75% {
        transform: scaleX(1);
      }

      100% {
        transform: scaleX(.05);
      }
    }


    /* SCANNER */

    .scanner {
      animation: scan 4s linear infinite;
    }

    @keyframes scan {
      from {
        transform: translateX(-200px);
      }

      to {
        transform: translateX(1100px);
      }
    }

  </style>


  <!-- BACKGROUND -->

  <rect x="8"
        y="8"
        width="884"
        height="244"
        rx="16"
        fill="url(#bg)"
        stroke="#7e22ce"
        stroke-width="2"/>

  <rect x="10"
        y="10"
        width="880"
        height="240"
        rx="15"
        fill="none"
        stroke="#a855f7"
        opacity=".18"
        filter="url(#glow)"/>


  <!-- HEADER -->

  <text x="30"
        y="38"
        class="mono purple"
        font-size="11">

    LAZARUS // AUDIO INTERFACE

  </text>

  <circle cx="810"
          cy="34"
          r="4"
          fill="#55ff88"
          class="status"/>

  <text x="822"
        y="38"
        class="mono green"
        font-size="9">

    ONLINE

  </text>

  <line x1="30"
        y1="55"
        x2="870"
        y2="55"
        stroke="url(#purple)"
        opacity=".55"/>


  <!-- TITLE -->

  <text x="450"
        y="91"
        text-anchor="middle"
        class="ui purple title"
        font-size="22"
        font-weight="700">

    ♫ SPOTIFY // NOW PLAYING

  </text>


  <!-- LEFT DISC -->

  <g class="disc">

    <circle cx="160"
            cy="156"
            r="58"
            fill="#08070c"
            stroke="#7e22ce"
            stroke-width="2"
            filter="url(#glow)"/>

    <circle cx="160"
            cy="156"
            r="47"
            fill="none"
            stroke="#3b1b4c"
            stroke-width="2"/>

    <circle cx="160"
            cy="156"
            r="35"
            fill="none"
            stroke="#3b1b4c"
            stroke-width="2"/>

    <circle cx="160"
            cy="156"
            r="23"
            fill="#160b20"
            stroke="#a855f7"
            stroke-width="2"/>

    <circle cx="160"
            cy="156"
            r="7"
            fill="#c084fc"
            filter="url(#glow)"/>

  </g>


  <!-- MUSIC NOTES -->

  <text x="95"
        y="120"
        class="purple note1"
        font-size="21">

    ♪

  </text>

  <text x="220"
        y="130"
        class="purple note2"
        font-size="19">

    ♫

  </text>


  <!-- RIGHT PANEL -->

  <rect x="280"
        y="115"
        width="540"
        height="87"
        rx="10"
        fill="#090711"
        stroke="#552273"/>

  <text x="305"
        y="140"
        class="mono purple"
        font-size="11">

    user@lazarus:~$ spotify --connect

  </text>

  <text x="305"
        y="165"
        class="mono white"
        font-size="11">

    STREAM STATUS:

  </text>

  <text x="410"
        y="165"
        class="mono green"
        font-size="11">

    CONNECTED

  </text>

  <text x="305"
        y="187"
        class="mono muted"
        font-size="10">

    external Spotify feed initialized...

  </text>


  <!-- EQUALIZER -->

  <g transform="translate(725 181)">

    <rect x="0"
          y="-23"
          width="5"
          height="23"
          rx="2"
          fill="#c084fc"
          class="b1"/>

    <rect x="10"
          y="-32"
          width="5"
          height="32"
          rx="2"
          fill="#9333ea"
          class="b2"/>

    <rect x="20"
          y="-18"
          width="5"
          height="18"
          rx="2"
          fill="#c084fc"
          class="b3"/>

    <rect x="30"
          y="-28"
          width="5"
          height="28"
          rx="2"
          fill="#a855f7"
          class="b4"/>

    <rect x="40"
          y="-20"
          width="5"
          height="20"
          rx="2"
          fill="#c084fc"
          class="b5"/>

  </g>


  <!-- BOTTOM BAR -->

  <text x="280"
        y="225"
        class="mono muted"
        font-size="9">

    AUDIO CORE

  </text>

  <rect x="355"
        y="218"
        width="280"
        height="8"
        rx="4"
        fill="#21112b"/>

  <rect x="355"
        y="218"
        width="280"
        height="8"
        rx="4"
        fill="url(#purple)"
        class="progress"
        filter="url(#glow)"/>

  <text x="650"
        y="226"
        class="mono green status"
        font-size="9">

    LIVE

  </text>


  <!-- SCANNER -->

  <rect x="0"
        y="239"
        width="170"
        height="1"
        fill="url(#purple)"
        class="scanner"
        filter="url(#glow)"/>


  <!-- CRT -->

  <rect x="8"
        y="8"
        width="884"
        height="244"
        rx="16"
        fill="url(#scanlines)"
        pointer-events="none"/>

</svg>
