<svg width="900" height="230" viewBox="0 0 900 230"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050509"/>
      <stop offset="50%" stop-color="#0d0615"/>
      <stop offset="100%" stop-color="#170522"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines"
             width="4"
             height="4"
             patternUnits="userSpaceOnUse">

      <rect width="4"
            height="1"
            fill="#ffffff"
            opacity=".018"/>

    </pattern>

  </defs>


  <style>

    .mono {
      font-family: "JetBrains Mono", "Courier New", monospace;
    }

    .ui {
      font-family: Arial, Helvetica, sans-serif;
    }

    .purple {
      fill: #c084fc;
    }

    .green {
      fill: #55ff88;
    }

    .white {
      fill: #f4f4f5;
    }

    .muted {
      fill: #a1a1aa;
    }

    .title {
      animation: titleGlow 2.5s ease-in-out infinite;
    }

    @keyframes titleGlow {
      0%,100% {
        opacity: .65;
      }

      50% {
        opacity: 1;
        filter: url(#glow);
      }
    }

    .status {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% {
        opacity: .35;
      }

      50% {
        opacity: 1;
      }
    }

    .b1 {
      animation: bar1 .6s ease-in-out infinite alternate;
      transform-origin: bottom;
    }

    .b2 {
      animation: bar2 .8s ease-in-out infinite alternate;
      transform-origin: bottom;
    }

    .b3 {
      animation: bar3 .5s ease-in-out infinite alternate;
      transform-origin: bottom;
    }

    .b4 {
      animation: bar4 .7s ease-in-out infinite alternate;
      transform-origin: bottom;
    }

    .b5 {
      animation: bar5 .9s ease-in-out infinite alternate;
      transform-origin: bottom;
    }

    @keyframes bar1 {
      from { transform: scaleY(.3); }
      to   { transform: scaleY(1); }
    }

    @keyframes bar2 {
      from { transform: scaleY(.5); }
      to   { transform: scaleY(1.25); }
    }

    @keyframes bar3 {
      from { transform: scaleY(.25); }
      to   { transform: scaleY(.85); }
    }

    @keyframes bar4 {
      from { transform: scaleY(.4); }
      to   { transform: scaleY(1.1); }
    }

    @keyframes bar5 {
      from { transform: scaleY(.2); }
      to   { transform: scaleY(.9); }
    }

    .note1 {
      animation: note1 4s ease-in-out infinite;
    }

    .note2 {
      animation: note2 5s ease-in-out infinite;
    }

    @keyframes note1 {
      0%,100% {
        opacity: .15;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-15px);
      }
    }

    @keyframes note2 {
      0%,100% {
        opacity: .1;
        transform: translateY(0);
      }

      50% {
        opacity: .8;
        transform: translateY(-10px);
      }
    }

    .progress {
      transform-origin: left;
      animation: progress 8s linear infinite;
    }

    @keyframes progress {
      0% {
        transform: scaleX(.05);
      }

      80% {
        transform: scaleX(1);
      }

      100% {
        transform: scaleX(.05);
      }
    }

    .scanner {
      animation: scanner 4s linear infinite;
    }

    @keyframes scanner {
      from {
        transform: translateX(-200px);
      }

      to {
        transform: translateX(1100px);
      }
    }

  </style>


  <!-- BACKGROUND -->

  <rect x="8"
        y="8"
        width="884"
        height="214"
        rx="16"
        fill="url(#bg)"
        stroke="#7e22ce"
        stroke-width="2"/>

  <rect x="10"
        y="10"
        width="880"
        height="210"
        rx="15"
        fill="none"
        stroke="#a855f7"
        opacity=".16"
        filter="url(#glow)"/>


  <!-- HEADER -->

  <text x="30"
        y="38"
        class="mono purple"
        font-size="11">

    LAZARUS // AUDIO INTERFACE

  </text>

  <circle cx="805"
          cy="34"
          r="4"
          fill="#55ff88"
          class="status"/>

  <text x="817"
        y="38"
        class="mono green"
        font-size="9">

    STREAMING

  </text>

  <line x1="30"
        y1="55"
        x2="870"
        y2="55"
        stroke="url(#purple)"
        opacity=".5"/>


  <!-- TITLE -->

  <text x="450"
        y="91"
        text-anchor="middle"
        class="ui purple title"
        font-size="22"
        font-weight="700">

    ♫ SPOTIFY // NOW PLAYING

  </text>

  <text x="450"
        y="112"
        text-anchor="middle"
        class="mono muted"
        font-size="9">

    LIVE AUDIO FEED // LAZARUS CORE

  </text>


  <!-- LEFT NOTES -->

  <text x="105"
        y="145"
        class="purple note1"
        font-size="22">

    ♪

  </text>

  <text x="135"
        y="180"
        class="purple note2"
        font-size="17">

    ♫

  </text>


  <!-- RIGHT NOTES -->

  <text x="775"
        y="145"
        class="purple note2"
        font-size="21">

    ♫

  </text>

  <text x="745"
        y="180"
        class="purple note1"
        font-size="17">

    ♪

  </text>


  <!-- CENTER CONNECT PANEL -->

  <rect x="250"
        y="130"
        width="400"
        height="55"
        rx="10"
        fill="#090711"
        stroke="#552273"/>

  <text x="275"
        y="153"
        class="mono purple"
        font-size="10">

    user@lazarus:~$ spotify --connect

  </text>

  <text x="275"
        y="173"
        class="mono white"
        font-size="10">

    STREAM:

  </text>

  <text x="335"
        y="173"
        class="mono green status"
        font-size="10">

    CONNECTED

  </text>


  <!-- LEFT EQUALIZER -->

  <g transform="translate(175 177)">

    <rect x="0"
          y="-17"
          width="5"
          height="17"
          rx="2"
          fill="#c084fc"
          class="b1"/>

    <rect x="10"
          y="-28"
          width="5"
          height="28"
          rx="2"
          fill="#9333ea"
          class="b2"/>

    <rect x="20"
          y="-14"
          width="5"
          height="14"
          rx="2"
          fill="#c084fc"
          class="b3"/>

    <rect x="30"
          y="-24"
          width="5"
          height="24"
          rx="2"
          fill="#a855f7"
          class="b4"/>

    <rect x="40"
          y="-19"
          width="5"
          height="19"
          rx="2"
          fill="#c084fc"
          class="b5"/>

  </g>


  <!-- RIGHT EQUALIZER -->

  <g transform="translate(680 177)">

    <rect x="0"
          y="-19"
          width="5"
          height="19"
          rx="2"
          fill="#c084fc"
          class="b5"/>

    <rect x="10"
          y="-24"
          width="5"
          height="24"
          rx="2"
          fill="#a855f7"
          class="b4"/>

    <rect x="20"
          y="-14"
          width="5"
          height="14"
          rx="2"
          fill="#c084fc"
          class="b3"/>

    <rect x="30"
          y="-28"
          width="5"
          height="28"
          rx="2"
          fill="#9333ea"
          class="b2"/>

    <rect x="40"
          y="-17"
          width="5"
          height="17"
          rx="2"
          fill="#c084fc"
          class="b1"/>

  </g>


  <!-- BOTTOM PROGRESS -->

  <rect x="330"
        y="200"
        width="240"
        height="6"
        rx="3"
        fill="#21112b"/>

  <rect x="330"
        y="200"
        width="240"
        height="6"
        rx="3"
        fill="url(#purple)"
        class="progress"
        filter="url(#glow)"/>


  <!-- SCANNER -->

  <rect x="0"
        y="214"
        width="170"
        height="1"
        fill="url(#purple)"
        class="scanner"
        filter="url(#glow)"/>


  <!-- CRT -->

  <rect x="8"
        y="8"
        width="884"
        height="214"
        rx="16"
        fill="url(#scanlines)"
        pointer-events="none"/>

</svg>
